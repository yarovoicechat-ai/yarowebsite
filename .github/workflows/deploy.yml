name: Deploy Meethi Chat Website to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST || '217.216.58.223' }}
          username: ${{ secrets.VPS_USERNAME || 'root' }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            cd /root/apps/meethi-chaat-web
            git pull origin main || true
            npm install
            npm run build
            PORT=3005 pm2 restart web-frontend --update-env
            echo "🎉 Meethi Chat Website CI/CD Auto-Deployed Successfully!"
